<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>BPS 用量</title>
<style>
  :root { color-scheme: dark; }
  #bpsu { margin:0; padding:18px 20px 40px; background:#0f1115; color:#e6e8eb;
         font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; }
  #bpsu h1 { font-size:17px; margin:0 0 4px; }
  .bpsu-sub { color:#8b93a1; margin-bottom:14px; }
  .bpsu-cards { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .bpsu-card { background:#151922; border:1px solid #232733; border-radius:9px; padding:9px 16px; min-width:92px; }
  .bpsu-card b { display:block; font-size:19px; line-height:1.3; }
  .bpsu-card span { color:#8b93a1; }
  .bpsu-card.bps b { color:#58a6ff; } .bpsu-card.fwd b { color:#d29922; } .bpsu-card.bad b { color:#f85149; }
  #bpsu h3 { font-size:14px; margin:22px 0 8px; color:#c9d1d9; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
  th, td { border-bottom:1px solid #232733; padding:6px 9px; text-align:right; white-space:nowrap; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align:left; }
  th { color:#8b93a1; font-weight:500; background:#151922; position:sticky; top:0; }
  tr:hover td { background:#151922; }
  .bpsu-ok { color:#3fb950; } .bpsu-bad { color:#f85149; } .bpsu-bps { color:#58a6ff; } .bpsu-fwd { color:#d29922; }
  button { background:#1f2634; color:#e6e8eb; border:1px solid #2d3444; border-radius:7px; padding:5px 12px; cursor:pointer; }
  button:hover { background:#26303f; }
  .bpsu-bar { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .bpsu-err { background:#2a1618; border:1px solid #6b2b30; color:#ffb4b4; padding:10px 14px; border-radius:8px; margin-bottom:14px; white-space:pre-wrap; }
  .bpsu-muted { color:#6b7280; }
  code { background:#1b2130; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body style="margin:0;background:#0f1115">
<div id="bpsu">
<h1 id="bpsu-title">BPS 用量</h1>
<div class="bpsu-sub" id="bpsu-sub">数据来自 bps-shim 的独立用量库（不经过 CPA/CPAMP）</div>
<div class="bpsu-bar">
  <button id="bpsu-refresh">立即刷新</button>
  <span class="bpsu-muted" id="bpsu-stamp">—</span>
</div>
<div id="bpsu-error" class="bpsu-err" style="display:none"></div>
<div class="bpsu-cards">
  <div class="bpsu-card"><b id="bpsu-c-total">—</b><span id="bpsu-c-total-label">近 7 天请求</span></div>
  <div class="bpsu-card bpsu-bps"><b id="bpsu-c-bps">—</b><span>走 BPS</span></div>
  <div class="bpsu-card bpsu-fwd"><b id="bpsu-c-fwd">—</b><span>转发 CPA</span></div>
  <div class="bpsu-card bpsu-bad"><b id="bpsu-c-fail">—</b><span>失败</span></div>
</div>
<h3>按天 / 走向 / 模型</h3>
<table id="bpsu-summary"><thead><tr>
  <th>日期</th><th>走向</th><th>模型</th><th>次数</th><th>输入</th><th>输出</th><th>缓存读</th><th>推理</th><th>平均耗时</th><th>失败</th>
</tr></thead><tbody></tbody></table>
<h3>最近请求</h3>
<table id="bpsu-requests"><thead><tr>
  <th>时间 (UTC+8)</th><th>模型</th><th>走向</th><th>档位</th><th>输入</th><th>输出</th><th>缓存</th><th>首字</th><th>耗时</th><th>轮次</th><th>工具 (BPS/客户端)</th><th>状态</th>
</tr></thead><tbody></tbody></table>
<script>
const CFG = __BPS_USAGE_CONFIG__;
const $ = (id) => document.getElementById(id);
const num = (v) => (v || v === 0) ? Number(v).toLocaleString() : "0";
const secs = (ms) => ms ? (ms / 1000).toFixed(1) + "s" : "—";
const ts = (ms) => {
  if (!ms) return "—";
  const d = new Date(ms + 8 * 3600 * 1000);           // 固定 UTC+8 展示
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}:${p(d.getUTCSeconds())}`;
};
const routeClass = (r) => r === "bps" ? "bps" : "fwd";

document.title = CFG.title + " · BPS";
$("bpsu-title").textContent = CFG.title;
$("bpsu-c-total-label").textContent = `近 ${CFG.days} 天请求`;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function showError(msg) {
  const box = $("bpsu-error");
  box.style.display = "block";
  box.textContent = msg;
}
function clearError() { $("bpsu-error").style.display = "none"; }

async function load() {
  const base = (CFG.shimUrl || "/bps").replace(/\/+$/, "");
  const url = `${base}/usage.json?key=${encodeURIComponent(CFG.shimKey || "")}&days=${CFG.days}&limit=${CFG.limit}`;
  try {
    const res = await fetch(url, { headers: { "accept": "application/json" } });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    clearError();
    render(data);
    $("bpsu-stamp").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (err) {
    showError(`读取 ${url} 失败：${err.message}\n\n排查：① 配置里的 shim_url 是否与 CPA 同源（推荐 /bps）② shim_key 是否为 BPS_SHIM_KEY ③ 浏览器控制台是否 CORS 报错 ④ 服务器上 curl -H "Authorization: Bearer <key>" ${base}/usage.json 是否 200`);
  }
}

function render(data) {
  const summary = data.summary || [], rows = data.requests || [];
  const total = summary.reduce((a, r) => a + (r.n || 0), 0);
  const bps = summary.filter((r) => r.route === "bps").reduce((a, r) => a + (r.n || 0), 0);
  const fwd = summary.filter((r) => r.route !== "bps").reduce((a, r) => a + (r.n || 0), 0);
  const fails = summary.reduce((a, r) => a + (r.failures || 0), 0);
  $("bpsu-c-total").textContent = num(total);
  $("bpsu-c-bps").textContent = num(bps);
  $("bpsu-c-fwd").textContent = num(fwd);
  $("bpsu-c-fail").textContent = num(fails);

  $("bpsu-summary").tBodies[0].innerHTML = summary.map((r) => `<tr>
    <td>${esc(r.day)}</td><td class="${routeClass(r.route)}">${esc(r.route)}</td><td>${esc(r.model)}</td>
    <td>${num(r.n)}</td><td>${num(r.input_tokens)}</td><td>${num(r.output_tokens)}</td>
    <td>${num(r.cached)}</td><td>${num(r.reasoning)}</td>
    <td>${secs(r.avg_ms)}</td><td class="${r.failures ? "bad" : ""}">${num(r.failures)}</td></tr>`).join("")
    || `<tr><td colspan="10" class="bpsu-muted">暂无数据</td></tr>`;

  $("bpsu-requests").tBodies[0].innerHTML = rows.map((r) => `<tr>
    <td>${ts(r.ts_ms)}</td><td>${esc(r.model)}</td><td class="${routeClass(r.route)}">${esc(r.route)}</td>
    <td>${esc(r.effort || "")}</td><td>${num(r.input_tokens)}</td><td>${num(r.output_tokens)}</td>
    <td>${num(r.cached_tokens)}</td><td>${secs(r.ttft_ms)}</td><td>${secs(r.latency_ms)}</td>
    <td>${esc(r.iterations || "")}</td><td>${num(r.bps_tool_calls)}/${num(r.client_tool_calls)} ${esc(r.client_tool_names || "")}</td>
    <td class="${r.status === "ok" ? "ok" : "bad"}" title="${esc(r.error || "")}">${esc(r.status)}</td></tr>`).join("")
    || `<tr><td colspan="12" class="bpsu-muted">暂无数据</td></tr>`;
}

$("bpsu-refresh").addEventListener("click", load);
load();
setInterval(load, Math.max(5, CFG.refreshSeconds || 30) * 1000);
</script>
</div>
</body>
</html>
