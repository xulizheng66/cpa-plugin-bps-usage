name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Resolve version
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in ""|"$GITHUB_REF_NAME") V="0.0.0-dev" ;; esac
          echo "VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Install toolchains
        run: |
          sudo apt-get update
          # libc6-dev-arm64-cross 是交叉编译的 sysroot 头文件，缺了会报 bits/wordsize.h 找不到
          sudo apt-get install -y --no-install-recommends \
            build-essential libc6-dev libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build linux/arm64
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: arm64
          CC: aarch64-linux-gnu-gcc
        run: go build -buildvcs=false -buildmode=c-shared -o "dist/bps-usage-v${VERSION}-linux-arm64.so" .

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          CC: gcc
        run: go build -buildvcs=false -buildmode=c-shared -o "dist/bps-usage-v${VERSION}-linux-amd64.so" .

      - name: Checksums
        run: |
          rm -f dist/*.h
          (cd dist && sha256sum ./*.so > SHA256SUMS && file ./*.so)

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Regenerate store registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/gen_registry.py

      - name: Commit registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/registry.json
          if git diff --cached --quiet; then echo "registry unchanged"; else
            git commit -m "store: registry for ${GITHUB_REF_NAME}"
            git push
          fi
