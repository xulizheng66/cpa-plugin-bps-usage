name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Build (linux/arm64 + linux/amd64)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.0.0-dev"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -buildvcs=false -buildmode=c-shared -o "dist/bps-usage-v${VERSION}-linux-arm64.so" .
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false -buildmode=c-shared -o "dist/bps-usage-v${VERSION}-linux-amd64.so" .
          rm -f dist/*.h
          (cd dist && sha256sum ./*.so > SHA256SUMS)
          file dist/*.so

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Regenerate store registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 scripts/gen_registry.py

      - name: Commit registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/registry.json
          if git diff --cached --quiet; then echo "registry unchanged"; else
            git commit -m "store: registry for ${GITHUB_REF_NAME}"
            git push
          fi
